<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#1c2b2a;--mut:#5d6f6d;--line:#d8e0de;--ac:#14746f;--acx:#fff;--soft:#dff0ee;--warn:#b4472b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111a19;--card:#182524;--ink:#e6efed;--mut:#98aeab;--line:#2a3d3b;--ac:#4fc3bb;--acx:#0b1c1b;--soft:#1e3533;--warn:#f08a6c}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111a19;--card:#182524;--ink:#e6efed;--mut:#98aeab;--line:#2a3d3b;--ac:#4fc3bb;--acx:#0b1c1b;--soft:#1e3533;--warn:#f08a6c}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{padding:20px 16px 8px;max-width:860px;margin:auto}
h1{font:700 1.5rem/1.2 Georgia,"Times New Roman",serif;margin:0}
header p{margin:4px 0 0;color:var(--mut);font-size:.9rem}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:860px;margin:auto}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer}
nav button[aria-selected=true]{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
main{max-width:860px;margin:auto;padding:8px 16px 48px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
textarea{min-height:120px;resize:vertical}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 3px}
.btn{border:1px solid var(--ac);background:var(--ac);color:var(--acx);border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:transparent;color:var(--ac)}.btn.d{background:transparent;color:var(--warn);border-color:var(--warn)}
.btn.s{padding:4px 10px;font-size:.85rem;font-weight:500}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card.next{border-left:6px solid var(--ac)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.date{font-weight:700;text-transform:capitalize}.tag{font-size:.8rem;background:var(--soft);padding:2px 8px;border-radius:999px;margin-left:6px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.roles div{font-size:.8rem;color:var(--mut)}.roles b{display:block;color:var(--ink);font-size:1rem;font-weight:600}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.ck{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ck input{width:22px;height:22px;flex:0 0 22px;accent-color:var(--ac)}
.ck span{flex:1}.ck.on span{text-decoration:line-through;color:var(--mut)}
.x{background:none;border:0;color:var(--mut);font-size:1.2rem;cursor:pointer;padding:2px 8px}
.prog{height:6px;background:var(--soft);border-radius:4px;margin:8px 0;overflow:hidden}.prog i{display:block;height:100%;background:var(--ac)}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
summary{padding:12px 14px;font-weight:600;cursor:pointer}
details .in{padding:0 14px 14px;white-space:pre-wrap}
.empty{color:var(--mut);text-align:center;padding:28px 8px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#ov.o{display:flex}#box{background:var(--card);border-radius:12px;padding:18px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
#box h2{margin:0 0 4px;font-size:1.15rem}
.foot{text-align:center;margin-top:24px}
</style>

<style>
:root{--bg:#eef3f2;--card:#fff;--ink:#12292a;--mut:#62787a;--line:#e1e9e8;--ac:#0e8f86;--acx:#fff;--soft:#e2f3f1;--warn:#c4472b;--amb:#f5a524;--sh:0 1px 2px rgba(16,42,43,.06),0 10px 28px -10px rgba(16,42,43,.16);--hero:linear-gradient(135deg,#0a3535,#0e6a65 65%,#18a094)}

:root[data-theme="dark"]{--bg:#0b1514;--card:#142220;--ink:#e8f1ef;--mut:#93aaa7;--line:#243836;--ac:#3cc4b8;--acx:#06201e;--soft:#1a312e;--warn:#f28b6d;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px -10px rgba(0,0,0,.5);--hero:linear-gradient(135deg,#07201f,#0b4642 65%,#127a72)}
body{font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header.hero{max-width:none;margin:0;background:var(--hero);color:#fff;padding:30px 16px 70px}
.hero .in{max-width:860px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
h1{font:800 1.8rem/1.1 "Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:-.02em;color:#fff}
.hero p{color:rgba(255,255,255,.82);margin-top:8px}
.eq{display:flex;gap:5px;align-items:flex-end;height:46px;flex:0 0 auto}

nav{width:calc(100% - 32px);max-width:828px;margin:-34px auto 4px;top:calc(env(safe-area-inset-top,0px) + 8px);background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:6px;gap:4px}

nav button[aria-selected=true]{background:var(--ac);color:var(--acx);box-shadow:0 6px 14px -6px var(--ac)}
main{padding-top:14px}
.card{border:0;border-radius:20px;box-shadow:var(--sh);padding:18px 20px}
.card.next{background:linear-gradient(135deg,var(--soft),var(--card) 65%);box-shadow:0 0 0 2px var(--ac),var(--sh)}
.date{font-size:1.12rem;letter-spacing:-.01em}
.tag{background:var(--soft);color:var(--ac);font-weight:700;padding:3px 11px}
.tag+.tag{background:var(--amb);color:#2b1c00}
.roles{gap:10px;margin:14px 0 4px}
.roles div{background:var(--bg);border-radius:14px;padding:11px 13px;font-size:.74rem}
.roles b{font-size:.98rem;margin-top:2px}
.btn{border-radius:12px;padding:10px 18px}
.bar>.btn{box-shadow:0 8px 18px -8px var(--ac)}
.btn.g{background:var(--soft);border-color:transparent;color:var(--ac)}
.btn.d{background:rgba(196,71,43,.1);border-color:transparent}
.btn.s{padding:6px 12px;border-radius:10px}
input,textarea,select{border-radius:12px;padding:11px 14px;border:1.5px solid var(--line)}
input[type=search]{box-shadow:var(--sh);border-color:transparent}
.ck{padding:11px 0}
.ck input{border-radius:8px}
.prog{height:8px;border-radius:99px}
.prog i{background:linear-gradient(90deg,var(--ac),#3fd8c9);border-radius:99px;transition:width .3s}
details{border:0;border-radius:16px;box-shadow:var(--sh)}
summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 18px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.5rem;font-weight:500;color:var(--ac);line-height:1}
details[open] summary::after{content:"−"}
details .in{padding:0 18px 18px;line-height:1.65}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:20px;padding:36px 16px}
#ov{backdrop-filter:blur(5px);background:rgba(6,20,19,.55)}
#box{border-radius:22px;padding:22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
</style>
<meta name="theme-color" content="#0a3535">
<style>

</style>
<style>
.ban{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px;padding:16px 18px;border-radius:24px;background:linear-gradient(135deg,var(--soft),var(--card));box-shadow:var(--sh)}

<style>

/* backup */
function vBkp(m){
 m.innerHTML="<div class='card'><b>Backup dos dados</b><p style='color:var(--mut)'>"+(sb?"Os dados ficam salvos online e são compartilhados com a equipe. Gere um backup de vez em quando como cópia de segurança.":"Os dados ficam salvos neste aparelho e navegador. Para guardar uma cópia ou levar para outro aparelho, copie o texto do backup e cole-o depois na restauração.")+"</p><div class='acts'><button class='btn' id='ex'>Gerar backup</button><button class='btn g' id='im'>Restaurar backup</button><button class='btn g' id='th'>Alternar tema claro/escuro</button>"+(sb?"<button class='btn d' id='lo'>Sair da conta</button>":"")+"</div></div>";
 $("ex").onclick=function(){modal("Backup",[{k:"x",l:"Copie todo este texto e guarde",t:"area"}],{x:JSON.stringify(S)})};
 $("lo")&&($("lo").onclick=function(){sb.auth.signOut().then(function(){location.reload()})});
 $("im").onclick=function(){modal("Restaurar backup",[{k:"x",l:"Cole aqui o texto do backup",t:"area"}],{},function(o){try{var d=JSON.parse(o.x);if(!d.des||!d.chk||!d.man||!d.faq)throw 0;S=d;save();render()}catch(e){alert("Backup inválido. Confira se copiou o texto inteiro.");return false}},"Restaurar")};
 $("th").onclick=function(){var r=document.documentElement,dk=r.getAttribute("data-theme")=="dark"||(r.getAttribute("data-theme")!="light"&&matchMedia("(prefers-color-scheme:dark)").matches);r.setAttribute("data-theme",dk?"light":"dark")}
}
/* ===== Supabase ===== */
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("o");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("o")},3500)}
async function push(k){
 var j=JSON.stringify(S[k]),r=await sb.from("app_state").upsert({id:k,data:S[k],updated_at:new Date().toISOString()});
 if(r.error){toast("Sem conexão. A alteração será enviada depois.");return}
 snap[k]=j}
async function sync(){
 var r=await sb.from("app_state").select("id,data");
 if(r.error){toast("Não foi possível carregar os dados online.");return}
 var have={};
 r.data.forEach(function(x){if(KEYS.indexOf(x.id)<0)return;have[x.id]=1;S[x.id]=x.data;snap[x.id]=JSON.stringify(x.data)});
 try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
 render();
 KEYS.forEach(function(k){if(!have[k])push(k)})}
function subscribe(){
 sb.channel("app").on("postgres_changes",{event:"*",schema:"public",table:"app_state"},function(p){
  var r=p.new;if(!r||KEYS.indexOf(r.id)<0)return;
  var j=JSON.stringify(r.data);if(j===snap[r.id])return;
  S[r.id]=r.data;snap[r.id]=j;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  render()}).subscribe()}
function start(){$("out").hidden=false;render();sync();subscribe()}
$("out").onclick=function(){modal("Sair da conta?",[],{},function(){sb.auth.signOut().then(function(){location.reload()})},"Sair")};
$("eye").onclick=function(){var i=$("lp"),h=i.type=="password";i.type=h?"text":"password";this.textContent=h?"Ocultar":"Mostrar"};
$("lf").onsubmit=async function(e){
 e.preventDefault();$("lerr").textContent="";
 var r=await sb.auth.signInWithPassword({email:$("le").value.trim(),password:$("lp").value});
 if(r.error){$("lerr").textContent="Erro: "+r.error.message;return}
 $("login").classList.remove("o");start()};
window.addEventListener("online",function(){if(sb)save()});
function boot(){
 if(SUPABASE_URL.indexOf("COLE_AQUI")==0||typeof supabase=="undefined"){render();return}
 sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 sb.auth.getSession().then(function(r){if(r.data.session)start();else $("login").classList.add("o")})}
boot();
</script>
